name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  # Upload and deploy are separate jobs (the shape the deploy-pages README recommends), so
  # "Re-run failed jobs" re-runs only `deploy` and finds the one artifact `build` uploaded.
  # Re-running a single job that uploads too leaves two artifacts named github-pages in the run.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      # include-hidden-files keeps the files served today: v5 leaves dotfiles out by default.
      - uses: actions/upload-pages-artifact@v5
        with: {path: ., include-hidden-files: true}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      # The artifact lookup has come back empty right after a successful upload (2026-11-21/22).
      # deploy-pages looks the artifact up before it creates a deployment, so a failed lookup
      # leaves nothing behind. Any failure is retried once after a pause; a later failure (a
      # deployment that was created and then failed) just gets a second deployment attempt.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
