# Claude builds site changes; Joseph merges (the merge deploys). Same builder as enrichmeai/culvert and
# enrichmeai/culvert-book, ported from enrichmeai/valuedocs (2026-09-26).
#
# Trigger: a comment that STARTS with "@claude", or the `claude` label on an issue, and only when the
# actor is Joseph's account. The issue or PR must be his, or be a `<project>-sync` issue opened by this
# repository's own release-sync workflow (github-actions[bot]), whose body is the checker's output.
#
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).
#
# What this workflow can NOT do, by construction: deploy (pages.yml deploys main only, on merge),
# edit workflows (GITHUB_TOKEN has no `workflows` permission), merge, tag, or dispatch a workflow
# (disallowed below), or run two at once (one concurrency group, never cancelled mid-run).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-${{ github.repository }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == 'josepharuja' && (
        github.event.issue.user.login == 'josepharuja' ||
        github.event.pull_request.user.login == 'josepharuja' ||
        (github.event.issue.user.login == 'github-actions[bot]' && endsWith(github.event.issue.title, 'is behind the latest release'))
      ) && (
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The projects the pages describe, read-only, beside the site, for /release-sync.
      - name: Check out the projects (public, read-only)
        run: |
          for p in culvert enrich-test-api; do
            git clone --quiet --depth 1 "https://github.com/enrichmeai/$p.git" "$GITHUB_WORKSPACE/../$p"
          done

      # Pinned to the commit behind the v1 tag (the same pin valuedocs uses, 2026-09-24).
      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: claude
          include_comments_by_actor: josepharuja
          branch_prefix: claude/
          claude_args: >-
            --model opus
            --max-turns 80
            --add-dir ../culvert
            --add-dir ../enrich-test-api
            --disallowedTools "Bash(gh pr merge:*),Bash(gh workflow:*),Bash(gh api:*),Bash(gh release:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push --tags:*),Bash(curl -X:*)"
            --append-system-prompt "You are the builder for the EnrichMeAI site; Joseph merges, and the merge deploys. CLAUDE.md in this repository governs what you do. For a <project>-sync issue, follow the /release-sync skill with the project checked out at ../<project> (--repo ../culvert or ../enrich-test-api): every fact on a page comes from the project's source or its registry, never from memory, and tools/check-release-page.py must report 0 errors before you open the PR. Work only on the task in the triggering issue or comment; if it is ambiguous, reply with the question and stop. One branch and one PR per task, titled 'site: …', closing the issue. Never merge, tag, dispatch a workflow, or touch .github/workflows. You cannot take screenshots here: say the visual check at 390 px and 1280 px is left for Joseph. End every reply with: branch, head SHA, files changed, the checker's result line, and anything left for Joseph."
