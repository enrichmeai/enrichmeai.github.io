# Claude builds; the reviewer agent verifies; the founder merges or delegates via merge-gate
# (CLAUDE.md § "Autonomous build loop"). Ported from enrichmeai/valuedocs.
#
# Trigger: a comment that STARTS with "@claude" on an issue or PR, or the `claude` label on an issue,
# and only when the actor AND the issue/PR author are the founder's account.
#
# What this workflow can NOT do, by construction:
#   - deploy: a merge to main deploys the site, and merging is disallowed below; branch protection
#     on main should also require a PR with the `Site check` status.
#   - edit workflows: GITHUB_TOKEN has no `workflows` permission, so a push that changes
#     .github/workflows/ is refused by GitHub.
#   - run two at once: one concurrency group per repository, never cancelled mid-run.
#
# Note: pushes made with GITHUB_TOKEN do not start other workflows. `Site check` runs when the
# founder's account opens the PR from Claude's branch.
# (Docs: code.claude.com/docs/en/github-actions § "CI not running on Claude's commits".)
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-${{ github.repository }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.actor == 'josepharuja' &&
      (github.event.issue.user.login == 'josepharuja' || github.event.pull_request.user.login == 'josepharuja') && (
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned by SHA (the commit behind the v1 tag, as pinned in enrichmeai/valuedocs on
      # 2026-09-24): a third-party action that receives a write token is not pinned by a movable tag.
      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: claude
          include_comments_by_actor: josepharuja
          branch_prefix: claude/
          claude_args: >-
            --model opus
            --max-turns 80
            --disallowedTools "Bash(gh pr merge:*),Bash(gh workflow run:*),Bash(gh api:*),Bash(gh release:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push --tags:*),Bash(curl:*)"
            --append-system-prompt "You are the builder: Claude builds, the reviewer agent verifies, the founder merges. CLAUDE.md in this repository governs everything you do; follow the /build-task skill (check every claim against the product repo's release tag and every web behaviour against the pinned docs first, red then green, run the reviewer agent before replying, at most 3 fix attempts then a Blocker summary, then /compound). Work only on the task in the triggering issue or comment; if it is ambiguous, reply with the question and stop. One branch per task. Never relax a check, never widen a permission, never merge, tag, dispatch a workflow, or touch .github/workflows or CNAME. A merge to main deploys enrichmeai.com. End every reply with: branch, head SHA, files changed, checks run with their result, and anything left for the founder."
