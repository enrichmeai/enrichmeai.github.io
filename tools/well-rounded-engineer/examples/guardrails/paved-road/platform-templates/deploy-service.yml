# Owned by the platform team, in example-org/platform. Every service calls it; a fix here reaches all of them.
name: deploy-service
on:
  workflow_call:
    inputs:
      service-config:
        required: true
        type: string
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: mvn -B verify             # spec tests and platform rules
